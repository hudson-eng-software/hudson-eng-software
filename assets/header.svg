<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2A66"/>
      <stop offset="0.5" stop-color="#1E6FD9"/>
      <stop offset="1" stop-color="#C0C8D4"/>
    </linearGradient>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="0.6"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.2"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="260"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- ondas animadas -->
    <path d="M0 205 Q125 183 250 205 T500 205 T750 205 T1000 205 T1250 205 T1500 205 T1750 205 T2000 205 T2250 205 V300 H0 Z" fill="#FFFFFF" fill-opacity="0.14">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 222 Q100 204 200 222 T400 222 T600 222 T800 222 T1000 222 T1200 222 T1400 222 T1600 222 T1800 222 V300 H0 Z" fill="#C0C8D4" fill-opacity="0.22">
    <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M0 238 Q80 224 160 238 T320 238 T480 238 T640 238 T800 238 T960 238 T1120 238 T1280 238 T1440 238 T1600 238 T1760 238 V300 H0 Z" fill="#0A2A66" fill-opacity="0.45">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-320 0" dur="5s" repeatCount="indefinite"/>
  </path>

    <!-- linhas blueprint por cima -->
    <rect width="1000" height="260" fill="url(#minor)"/>
    <rect width="1000" height="260" fill="url(#major)"/>

    <!-- diagonais -->
    <g stroke="#fff" fill="none">
      <line x1="110" y1="260" x2="220" y2="0" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.8"/>
      <line x1="250" y1="260" x2="360" y2="0" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.8"/>
      <line x1="660" y1="260" x2="880" y2="0" stroke-width="1.6" stroke-opacity="0.9"/>
      <line x1="720" y1="260" x2="940" y2="0" stroke-width="1" stroke-dasharray="6 5" stroke-opacity="0.6"/>
    </g>

    <!-- reticle girando -->
    <g transform="translate(880 120)" stroke="#fff" fill="none">
      <circle r="58" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" stroke-width="2" stroke-dasharray="85 40">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="22" stroke-width="1.5"/>
      <circle r="3.5" fill="#fff"/>
    </g>

    <!-- moldura -->
    <rect x="12" y="12" width="976" height="236" fill="none" stroke="#fff" stroke-width="1.6" stroke-opacity="0.9"/>

    <!-- texto -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#fff" text-anchor="middle">
      <text x="470" y="115" font-size="60" font-weight="700" letter-spacing="6">HUDSON AMORIM</text>
      <line x1="190" y1="133" x2="750" y2="133" stroke="#fff" stroke-width="1.5"/>
      <line x1="190" y1="127" x2="190" y2="139" stroke="#fff" stroke-width="1.5"/>
      <line x1="750" y1="127" x2="750" y2="139" stroke="#fff" stroke-width="1.5"/>
      <text x="470" y="162" font-size="16" font-family="Courier New, monospace" letter-spacing="4">J.A.R.V.I.S. PROTOCOL // STATUS: ONLINE</text>
    </g>
    <circle cx="170" cy="157" r="4" fill="#fff">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
